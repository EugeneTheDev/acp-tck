[project]
name = "acp-tck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest==9.1.1",
]

[project.scripts]
acp-tck = "tck:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tck"

[tool.pytest.ini_options]
testpaths = ["tests"]
